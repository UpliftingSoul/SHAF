# 应用容器补充配置：与 docker-compose.yml 合并，连接其中的基础设施服务。
# MCP、分类器及 Langfuse 需要按 docs/DEPLOY.md 配置为云端容器地址。
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+asyncmy://root:root@mysql:3306/mewhelp}
      MILVUS_URI: http://milvus-standalone:19530
      CORS_ORIGINS: '[]'
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./log:/app/log
    depends_on:
      mysql:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
